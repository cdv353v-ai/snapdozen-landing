<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1080px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
    color: #ffffff;
    font-family: 'Inter', sans-serif;
    display: flex; flex-direction: column;
    justify-content: center;
    padding: 100px;
  }
  .emoji { font-size: 120px; margin-bottom: 40px; }
  .headline { font-family: 'Oswald', sans-serif; font-size: 104px; font-weight: 700; line-height: 1.0; letter-spacing: -0.02em; margin-bottom: 32px; }
  .sub { font-size: 36px; font-weight: 400; line-height: 1.3; opacity: 0.9; }
</style>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400&family=Oswald:wght@700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="emoji">⚡</div>
  <div class="headline">12 креативов.<br>2 минуты.</div>
  <div class="sub">Вставь ссылку — получи архив готовых баннеров для рекламы.</div>
</body>
</html>
