<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1080px;
    background: #f5f5f0;
    color: #1a1a1a;
    font-family: 'Inter', sans-serif;
    display: flex; flex-direction: column;
    justify-content: space-between;
    padding: 80px;
  }
  .illustration { flex: 1; display: flex; align-items: center; justify-content: center; }
  .illustration svg { width: 400px; height: 400px; }
  .headline { font-family: 'Oswald', sans-serif; font-size: 88px; font-weight: 700; line-height: 1.05; letter-spacing: -0.02em; margin-bottom: 24px; }
  .sub { font-size: 32px; color: #555; line-height: 1.4; }
</style>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400&family=Oswald:wght@700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="illustration">
    <svg viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="80" y="120" width="240" height="160" rx="8" stroke="#1a1a1a" stroke-width="4"/>
      <rect x="100" y="140" width="200" height="120" fill="#6C3CE1" opacity="0.1"/>
      <circle cx="200" cy="320" r="40" stroke="#1a1a1a" stroke-width="4"/>
      <rect x="180" y="280" width="40" height="40" fill="#1a1a1a"/>
      <circle cx="140" cy="200" r="24" fill="#1a1a1a"/>
      <path d="M140 224 L140 280 L180 280" stroke="#1a1a1a" stroke-width="4" fill="none"/>
    </svg>
  </div>
  <div>
    <div class="headline">Build something<br>people want.</div>
    <div class="sub">Проверь идею до того, как вложишь деньги в разработку.</div>
  </div>
</body>
</html>
