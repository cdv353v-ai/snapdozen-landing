<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1080px;
    background: #0a0a0a;
    color: #ffffff;
    font-family: 'Inter', sans-serif;
    display: flex; flex-direction: column;
    justify-content: space-between;
    padding: 80px;
  }
  .tag { font-size: 28px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: #6C3CE1; }
  .headline { font-family: 'Oswald', sans-serif; font-size: 96px; font-weight: 700; line-height: 1.05; letter-spacing: -0.02em; }
  .sub { font-size: 32px; color: #999; line-height: 1.4; }
  .footer { display: flex; align-items: center; gap: 16px; font-size: 24px; color: #666; }
  .dot { width: 12px; height: 12px; background: #6C3CE1; border-radius: 50%; }
</style>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Oswald:wght@700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="tag">Гипотеза 01</div>
  <div class="headline">Перестань гадать.<br>Проверь спрос.</div>
  <div class="sub">12 рекламных креативов за 2 минуты. Без дизайнера.</div>
  <div class="footer"><div class="dot"></div><span>SnapDozen</span></div>
</body>
</html>
